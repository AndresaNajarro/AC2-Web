<div class="container">
    <h2 class="tituloprincipal">Nova Inscrição em Oficina  Andresa e Bianca</h2>

    <div class="form-group">
        <label>Nome:</label>
        <input type="text" [(ngModel)]="nome" placeholder="Seu nome">
    </div>

    <div class="form-group">
        <label>E-mail:</label>
        <input type="email" [(ngModel)]="email" placeholder="Seu e-mail">
    </div>

    <div class="form-group">
        <label>Oficina:</label>
        <select [(ngModel)]="oficinaSelecionada">
            <option value="">Selecione...</option>
            <option *ngFor="let of of oficinasDisponiveis" [value]="of">{{ of }}</option>
        </select>
    </div>

    <button (click)="cadastrar()">Cadastrar</button>

    <br><br>

    <a routerLink="/lista">Ver Lista de Inscrições</a>
</div>
